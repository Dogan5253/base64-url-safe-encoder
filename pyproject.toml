[project]
name = "base64-url-safe-encoder"
version = "0.1.0"
description = "Encodes bytes using the URL-safe Base64 alphabet with no padding and decodes both padded and unpadded inputs."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
